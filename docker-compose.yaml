services:
  ollama:
    image: ollama/ollama
    container_name: assist-ollama
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - assist-ollama:/root/.ollama
  postgres:
    image: pgvector/pgvector:pg17
    container_name: assist-postgres
    environment:
      POSTGRES_DB: assist
      POSTGRES_USER: assist
      POSTGRES_PASSWORD: assist
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - assist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U assist -d assist"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: assist-adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  assist-pgdata:
  assist-ollama: