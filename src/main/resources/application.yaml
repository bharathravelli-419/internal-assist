spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/assist
    username: assist
    password: assist
  ai:
    model:
      chat: google-genai
      embedding: ollama
    ollama:
      base-url: http://localhost:11435
      embedding:
        options:
          model: nomic-embed-text:latest
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        dimensions: 768
        index-type: HNSW
    google:
      genai:
        api-key: ${API-KEY}
        chat:
          model: gemini-3.5-flash

app:
  excel:
    rows-per-chunk: 1
    max-rows: 5000

  ingestion:
    docs-dir: data/docs
    cron: "0 0 2 * * MON"
