spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/assist
    username: assist
    password: assist
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    model:
      chat: openai
      embedding: ollama
    ollama:
      base-url: http://localhost:11435
      embedding:
        options:
          model: nomic-embed-text:latest
    vectorstore:
      pgvector:
        initialize-schema: true
        distance-type: COSINE_DISTANCE
        dimensions: 768
        index-type: HNSW
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: GROQ_EKY
      chat:
        options:
          model: openai/gpt-oss-120b


    google:
      genai:
        api-key: GEMINI_KEY
        chat:
          model: gemini-3.5-flash

app:
  chat:
    history-messages: 15
  web:
    # MATCHED: Both use https://
    pages: "https://www.edwardjones.com/us-en/market-news-insights/guidance-perspective/ai-investing-ejp, https://www.edwardjones.com/us-en/why-edward-jones/news-media/press-releases/edward-jones-ventures-invests-ai-driven-solutions-help-families-navigate-lifes-biggest-financial"
    allowed-hosts: "www.edwardjones.com"

  rag:
    top-k: 4
    min-score: 0.55
    suggest-min-score: 0.35
  excel:
    rows-per-chunk: 1
    max-rows: 5000

  ingestion:
    base-dir: data/tenants
    cron: "0 0 2 * * MON"

  tenants:
    - id: edward-jones
      name: Edward Jones
      description: "financial services client - focuses on wealth management products"
      user-key: EJ-API-KEY
      admin-key: DUMMY12345678
      web-pages: ["https://www.edwardjones.com/us-en/market-news-insights/guidance-perspective/ai-investing-ejp", "https://www.edwardjones.com/us-en/why-edward-jones/news-media/press-releases/edward-jones-ventures-invests-ai-driven-solutions-help-families-navigate-lifes-biggest-financial", "https://www.edwardjones.com/us-en/investment-services/accounts-overview/unified-managed-account-models"]
      allowed-hosts: ["www.edwardjones.com"]

    - id: walmart-tech
      name: Walmart Global Tech
      description: "Walmart Global Tech. - Marketing and E Commerce"
      admin-key: DUMMY123458
      user-key: WM_API_KEY
      web-pages: ["https://www.tech.walmart.com/content/walmart-global-tech/en_us.html","https://www.walmartconnect.com/partners"]
      allowed-hosts: ["www.walmartconnect.com","www.tech.walmart.com"]